name: Coach personnel

on:
  schedule:
    - cron: '*/10 * * * *'   # toutes les 10 minutes : lit le salon du coach et répond (GitHub peut retarder)
  workflow_dispatch:

# Écriture : le coach range l'historique des combats des joueurs dans le dépôt (dossier historique/)
permissions:
  contents: write

concurrency:
  group: coach
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation des dépendances
        run: pip install requests

      - name: Coach
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_COACH }}
        run: python Coach.py repondre

      - name: Sauvegarde de l'historique des combats
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d historique ]; then git add historique; fi
          if ! git diff --cached --quiet; then
            git commit -m "Historique des combats (coach)"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi